name: Python CI

on:
  push:
    branches:
      - main
      - final-review

  pull_request:
    branches:
      - main
      - final-review

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: |
          flake8 .

      - name: Run Pytest
        run: |
          python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/backend-api:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/backend-api:latest .

      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/backend-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/backend-api:latest