name: Python CI

on:
  push:
    branches:
      - main
      - final-review

  pull_request:
    branches:
      - main
      - final-review


jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}


      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/backend-api:${{ github.sha }} .


      - name: Tag image as latest
        run: |
          docker tag \
          ghcr.io/${{ github.repository_owner }}/backend-api:${{ github.sha }} \
          ghcr.io/${{ github.repository_owner }}/backend-api:latest


      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/backend-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/backend-api:latest



  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Flake8
        run: |
          flake8 .


      - name: Run Pytest
        run: |
          python -m pytest